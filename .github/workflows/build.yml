name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            artifact: mk61-studio-windows
          - os: macos-latest
            target: --mac
            artifact: mk61-studio-macos
          - os: ubuntu-latest
            target: --linux --x64
            artifact: mk61-studio-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build
        run: npx electron-builder ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
          if-no-files-found: ignore

  # Collect every platform's artifacts into one GitHub Release, so the
  # installers are downloadable from the repo's Releases page.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: MK61 Studio ${{ github.ref_name }}
          body: |
            Open configuration software for the Gamakay MK61 (SK61L).

            * `*-Setup-*.exe` — Windows installer
            * `*-Portable-*.exe` — Windows, no install
            * `*.dmg` — macOS (Apple Silicon / Intel)
            * `*.AppImage` — Linux, runs anywhere
            * `*.deb` — Debian / Ubuntu
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.zip
            artifacts/*.blockmap
          fail_on_unmatched_files: false
